name: Build and Deploy WebGL

on:
  push:
    branches:
      - main  # Trigger on every push to the main branch

permissions:
  contents: write    # Allows pushing to the gh-pages branch
  pages: write       # Allows interacting with GitHub Pages settings
  id-token: write    # Required for some deployment security checks

jobs:
  build:
    name: Build for WebGL ✨
    runs-on: ubuntu-latest
    steps:
    # --- Reclaim disk space ---
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # This frees up ~15-20GB by removing Android, .NET, and Haskell
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          # Keep the runner's swap: the release build's link-time optimization needs it (see the next step).
          swap-storage: false

      # The release build links WebAssembly with link-time optimization (BuildScripts.BuildWebGLRelease), and
      # wasm-ld needs more than the runner's 16 GB of RAM for it: without swap the kernel kills it (SIGKILL) and
      # Unity reports only "Build failed with exit code 1". A large swap file lets it finish, more slowly.
      - name: Add swap for the WebAssembly link
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # Checkout the code (including LFS files)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Cache the Library folder to speed up future builds
      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: Library
          # Keyed by Editor version: a Library from another version is a full reimport anyway, and can break the build.
          key: Library-WebGL-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-WebGL-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}

      # Build the Unity Project
      - name: Unity Builder
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          # Sets the code optimization, which lives in Library rather than ProjectSettings (see BuildScripts).
          buildMethod: BuildScripts.BuildWebGLRelease

      # Deploy the 'build/WebGL/WebGL' folder to the 'gh-pages' branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/WebGL/WebGL